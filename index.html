<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Analisador Comercial Inteligente - CNPJ & Gemini AI</title>
  <style>
    :root {
      --primary-color: #2563eb;
      --primary-hover: #1d4ed8;
      --bg-color: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border-color: #e2e8f0;
      --success-color: #16a34a;
      --error-color: #dc2626;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; line-height: 1.5; }
    .container { max-width: 900px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 2rem; }
    header h1 { font-size: 2rem; margin-bottom: 0.5rem; }
    header p { color: var(--text-muted); }
    .card { background: var(--card-bg); border-radius: 12px; padding: 1.5rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); border: 1px solid var(--border-color); margin-bottom: 1.5rem; }
    .form-group { margin-bottom: 1.25rem; }
    label { display: block; font-weight: 600; margin-bottom: 0.5rem; font-size: 0.9rem; }
    input { width: 100%; padding: 0.75rem; border: 1px solid var(--border-color); border-radius: 6px; font-size: 1rem; }
    button { background-color: var(--primary-color); color: white; border: none; padding: 0.75rem 1.5rem; border-radius: 6px; font-size: 1rem; font-weight: 600; cursor: pointer; width: 100%; }
    button:hover { background-color: var(--primary-hover); }
    button:disabled { background-color: var(--text-muted); cursor: not-allowed; }
    .info-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .info-box { background-color: #f1f5f9; padding: 0.75rem; border-radius: 6px; }
    .info-box label { font-size: 0.75rem; text-transform: uppercase; color: var(--text-muted); }
    .info-box p { font-weight: 600; font-size: 0.95rem; }
    .status-badge { display: inline-block; padding: 0.25rem 0.5rem; border-radius: 4px; font-size: 0.8rem; font-weight: 700; }
    .badge-ALTO { background-color: #dcfce7; color: #166534; }
    .badge-MEDIO { background-color: #fef9c3; color: #854d0e; }
    .badge-BAIXO { background-color: #fee2e2; color: #991b1b; }
    .product-card { border-left: 4px solid var(--primary-color); background-color: #f8fafc; padding: 1rem; margin-bottom: 1rem; border-radius: 0 8px 8px 0; }
    .product-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; }
    .product-title { font-weight: 700; font-size: 1.1rem; }
    .hidden { display: none; }
    .error-msg { color: var(--error-color); font-size: 0.9rem; margin-top: 0.5rem; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Analisador Comercial de Produtos</h1>
      <p>Consulte o CNPJ e descubra os produtos com maior potencial de venda na região.</p>
    </header>

    <div class="card">
      <div class="form-group">
        <label for="apiKey">Gemini API Key</label>
        <input type="password" id="apiKey" placeholder="Cole sua chave da API do Google AI Studio">
      </div>
      <div class="form-group">
        <label for="cnpj">CNPJ do Cliente</label>
        <input type="text" id="cnpj" placeholder="Digite apenas números (14 dígitos)">
        <p id="cnpjError" class="error-msg hidden"></p>
      </div>
      <button id="btnAnalisar">Analisar Oportunidades de Venda</button>
    </div>

    <div id="companyCard" class="card hidden">
      <h2>Dados do Cliente</h2>
      <div class="info-grid">
        <div class="info-box"><label>Razão Social</label><p id="infoRazao">-</p></div>
        <div class="info-box"><label>Ramo / CNAE</label><p id="infoCnae">-</p></div>
        <div class="info-box"><label>Localização</label><p id="infoLocal">-</p></div>
      </div>
    </div>

    <div id="resultCard" class="card hidden">
      <h2>Produtos Recomendados pelo Gemini AI</h2>
      <p style="color: var(--text-muted); margin-bottom: 1rem; font-size: 0.9rem;">
        Análise gerada com base estritamente no estoque fixo salvo em produtos.json.
      </p>
      <div id="productList"></div>
    </div>
  </div>

  <script type="module">
    import { GoogleGenAI } from "https://esm.sh/@google/genai";

    let LISTA_PRODUTOS_MEMORIA = [];

    async function carregarEstoqueMemoria() {
      try {
        const response = await fetch('produtos.json');
        LISTA_PRODUTOS_MEMORIA = await response.json();
      } catch (err) {
        console.error('Erro ao carregar o estoque:', err);
      }
    }
    carregarEstoqueMemoria();

    const btnAnalisar = document.getElementById('btnAnalisar');
    const cnpjInput = document.getElementById('cnpj');
    const apiKeyInput = document.getElementById('apiKey');
    const cnpjError = document.getElementById('cnpjError');

    const companyCard = document.getElementById('companyCard');
    const resultCard = document.getElementById('resultCard');
    const productList = document.getElementById('productList');

    btnAnalisar.addEventListener('click', async () => {
      const cnpj = cnpjInput.value.replace(/\D/g, '');
      const apiKey = apiKeyInput.value.trim();

      if (!apiKey) { alert("Insira sua API Key do Gemini."); return; }
      if (cnpj.length !== 14) {
        cnpjError.textContent = "CNPJ inválido.";
        cnpjError.classList.remove('hidden');
        return;
      }

      btnAnalisar.disabled = true;
      btnAnalisar.textContent = "Processando...";
      companyCard.classList.add('hidden');
      resultCard.classList.add('hidden');

      try {
        const resCnpj = await fetch(`https://brasilapi.com.br/api/cnpj/v1/${cnpj}`);
        if (!resCnpj.ok) throw new Error("CNPJ não encontrado.");
        const dadosCnpj = await resCnpj.json();

        document.getElementById('infoRazao').textContent = dadosCnpj.razao_social || dadosCnpj.nome_fantasia;
        document.getElementById('infoCnae').textContent = dadosCnpj.cnae_fiscal_descricao;
        document.getElementById('infoLocal').textContent = `${dadosCnpj.municipio} - ${dadosCnpj.uf}`;
        companyCard.classList.remove('hidden');

        const ai = new GoogleGenAI({ apiKey: apiKey });

        const systemInstruction = `
          Você é um especialista comercial B2B.
          ESTOQUE DISPONÍVEL NA MEMÓRIA:
          ${LISTA_PRODUTOS_MEMORIA.map(p => `- ${p}`).join("\n")}

          REGRAS OBRIGATÓRIAS:
          1. Sugira SOMENTE produtos da lista acima.
          2. Selecione os 3 a 5 produtos com maior potencial de venda com base no CNAE e na localização (Cidade/UF).
          3. Responda estritamente no esquema JSON solicitado.
        `;

        const response = await ai.models.generateContent({
          model: 'gemini-2.5-flash',
          contents: `Cliente: ${dadosCnpj.razao_social} | CNAE: ${dadosCnpj.cnae_fiscal_descricao} | UF: ${dadosCnpj.uf} | Cidade: ${dadosCnpj.municipio}`,
          config: {
            systemInstruction: systemInstruction,
            responseMimeType: 'application/json',
            responseSchema: {
              type: 'OBJECT',
              properties: {
                produtosRecomendados: {
                  type: 'ARRAY',
                  items: {
                    type: 'OBJECT',
                    properties: {
                      nomeProduto: { type: 'STRING' },
                      motivoRecomendacao: { type: 'STRING' },
                      potencialDemanda: { type: 'STRING', enum: ['ALTO', 'MEDIO', 'BAIXO'] }
                    },
                    required: ['nomeProduto', 'motivoRecomendacao', 'potencialDemanda']
                  }
                }
              },
              required: ['produtosRecomendados']
            }
          }
        });

        const dadosIa = JSON.parse(response.text);
        renderizarProdutos(dadosIa.produtosRecomendados);
        resultCard.classList.remove('hidden');

      } catch (err) {
        alert("Erro: " + err.message);
      } finally {
        btnAnalisar.disabled = false;
        btnAnalisar.textContent = "Analisar Oportunidades de Venda";
      }
    });

    function renderizarProdutos(produtos) {
      productList.innerHTML = '';
      produtos.forEach(item => {
        const div = document.createElement('div');
        div.className = 'product-card';
        div.innerHTML = `
          <div class="product-header">
            <span class="product-title">${item.nomeProduto}</span>
            <span class="status-badge badge-${item.potencialDemanda}">${item.potencialDemanda} POTENCIAL</span>
          </div>
          <p style="font-size: 0.95rem; color: #334155;">${item.motivoRecomendacao}</p>
        `;
        productList.appendChild(div);
      });
    }
  </script>
</body>
</html>
